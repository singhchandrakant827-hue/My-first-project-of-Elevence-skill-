<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add like</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: gray;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color:green;
            color:yellow;
        }
        #likeCount {
            margin-top: 20px;
            font-size: 18px;
        }
        </style>        
</head>
<body>
    <h2>Add Like</h2>
    <p>Click the button to add a like!</p>
    <button onclick="addLike()">Like</button>
    <p id="likeCount">Likes: 0</p>

    <script>
        let likeCount = 0;

        function addLike() {
            likeCount++;
            document.getElementById("likeCount").innerText = "Likes: " + likeCount;
        }
    </script>
</body>
</html>
