<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinup Create Account</title>
    
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            
        

        }
        body{
            background: none;
            height: 100vh;
            display: flex;
            justify-content: center;
            text-align: center;
        }
        .container{
            margin: 40px;
            background:white;
            width: 350px;
            height: 30px;
            border-radius: 25px;
            box-shadow:0 8px 12px rgba(0,0,0,0.15) ;
            text-align: center;
        }
        h2{

            margin-bottom: 20px;
            color: black;
            font-size: medium;

        }
        label{
            float: left;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"],
        input[type="password"]{
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border:1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:hover,
        input[type="password"]:hover{
            border-color: blue;
        }
        input[type="submit"]{
            width: 200px;
            padding: 12px;
            background: rgb(108, 108, 238);
            border: 2px;
            color: white;
            font-size: 18px;
            font-style: italic;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        input[type="submit"]:hover{
            background-color: blueviolet;
        }
        p{
            margin-top: 15px;
            color: black;
            font-size: 13px;
        }
        a{
            color: blue;
            font-size: bold;
            
        }


    </style>
</head>
<body>
    <div class="container">
    <h2 style="font-style: italic; font-size:x-large;" >Sinup</h2>
    <form>
        <label>Username:</label>
        <input type="text"placeholder="Enter Username"required><br><br>
        <label>Password:</label>
        <input type="password"placeholder="Enter Password"required><br><br>
        <label>Confirm Password</label>
        <input type="text"placeholder="Enter Confirm Password"><br><br>
        <input type="submit" value="Create Account">
        

        </form>
                                                                           </a></p>
    
</body>
</html>
